name: windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 binutils-mingw-w64

      - name: Build x86 + x64 and run the Vista compatibility gate
        working-directory: win
        run: |
          make all
          make gate
          ls -l dist/
          for f in dist/sleepv-x86.exe dist/sleepv-x64.exe; do
            echo "--- $f"
            objdump -p "$f" | grep "DLL Name"
            objdump -p "$f" | grep -E "MajorSubsystemVersion|MinorSubsystemVersion"
          done

      - name: Fail on forbidden imports (Vista has no api-ms-* / UCRT)
        run: |
          if objdump -p win/dist/sleepv-x86.exe | grep -qiE "api-ms-|ext-ms-|vcruntime|ucrt|msvcp|concrt"; then
            echo "post-Vista import found in x86 build"; exit 1
          fi
          if objdump -p win/dist/sleepv-x64.exe | grep -qiE "api-ms-|ext-ms-|vcruntime|ucrt|msvcp|concrt"; then
            echo "post-Vista import found in x64 build"; exit 1
          fi

      - name: Size budget
        run: |
          for f in win/dist/sleepv-x86.exe win/dist/sleepv-x64.exe; do
            s=$(stat -c%s "$f"); echo "$f = $s bytes"
            [ "$s" -lt 200000 ] || { echo "build grew past 200 KB"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: sleepv-windows
          path: win/dist/sleepv-x*.exe
          if-no-files-found: error

  # Behavioural smoke test: catches parser, exit-code and installer regressions.
  # Wine is not a real Windows console, so this job stays non-blocking, but every
  # case below is asserted explicitly - a wrong exit code shows up as a warning
  # with a line number instead of a mysterious 127.
  # Behavioural smoke test. Wine is not a real Windows console, so the job does
  # not block anything; it exists to catch parser, exit-code and installer
  # regressions, and every case is asserted with its expected code.
  #
  # Kept deliberately short: one Wine start costs several seconds, so the matrix
  # is ~9 calls, durations are tiny, and the step carries a timeout so a stuck
  # Wine can never eat the runner minute budget.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine64
      - name: Run the x64 build under Wine
        timeout-minutes: 10
        env:
          WINEDEBUG: "-all"
          WINEDLLOVERRIDES: "mscoree=,mshtml="
          WINEPREFIX: ${{ github.workspace }}/.wine
          WINEARCH: win64
        run: |
          set -u
          exe=win/dist/sleepv-x64.exe
          # Ubuntu ships the interpreter as wine64; the bare "wine" name comes from
          # the metapackage, which also drags in wine32.
          WINE=$(command -v wine || command -v wine64 || true)
          if [ -z "$WINE" ]; then echo "::error::no wine interpreter on the runner"; exit 1; fi
          echo "using $("$WINE" --version 2>/dev/null | head -1)"
          boot=$(command -v wineboot || command -v wineboot64 || true)
          [ -n "$boot" ] && "$boot" -u || true

          # Actions runs this under bash -e: anything expected to fail must be
          # written as "cmd && rc=0 || rc=$?", otherwise the shell aborts the whole
          # step on the first non-zero status without printing a verdict.
          check() {  # check <expected code> <description> <args...>
            local want=$1 desc=$2; shift 2
            local rc
            "$WINE" "$exe" "$@" && rc=0 || rc=$?
            if [ "$rc" -eq "$want" ]; then
              echo "ok   [$desc] rc=$rc"
            else
              echo "::error::[$desc] expected rc=$want, got rc=$rc"
              return 1
            fi
          }

          "$WINE" "$exe" --version || { echo "::error::--version failed"; exit 1; }
          "$WINE" "$exe" --help > /dev/null || { echo "::error::--help failed"; exit 1; }

          check 0  "accepted forms summed"      0 0.25 0.5s 001
          check 1  "junk suffix 10x"            10x
          check 1  "attached units 10s5m"       10s5m
          check 1  "negative -5"                -5
          check 1  "30-day ceiling, not overflow"  999999999999999999999999
          check 5  "--run propagates the child code"  0.5s --run "cmd /c exit 5"

          # --install --dir has to create the folder itself; C:\windows\temp is the
          # one place a Wine prefix is always writable.
          check 0  "--install --dir"            --install --dir 'C:\windows\temp\ci-smoke'
          installed="$WINEPREFIX/drive_c/windows/temp/ci-smoke/sleepv.exe"
          [ -f "$installed" ] || { echo "::error::installed file missing"; exit 1; }
          echo "installed copy: $(stat -c %s "$installed") bytes"
          "$WINE" "$installed" 0.5s || { echo "::error::installed copy failed to run"; exit 1; }
          echo "smoke finished"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sleepv-windows
          path: bin
      - name: Checksums and release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd bin
          sha256sum sleepv-x*.exe > SHA256SUMS.txt
          S32=$(stat -c %s sleepv-x86.exe); S64=$(stat -c %s sleepv-x64.exe)
          H32=$(awk '/sleepv-x86/ {print $1}' SHA256SUMS.txt)
          H64=$(awk '/sleepv-x64/ {print $1}' SHA256SUMS.txt)
          cd ..
          cat > notes.md <<EOF
          Static Windows builds of sleepv - Windows Vista SP2 through Windows 11, x86 and x64, no runtime dependencies of any kind.

          | file | for | size, bytes | SHA-256 |
          | --- | --- | ---: | --- |
          | sleepv-x86.exe | 32-bit Windows, and any 64-bit Windows too | $S32 | \`$H32\` |
          | sleepv-x64.exe | 64-bit Windows (Vista SP2 and later) | $S64 | \`$H64\` |

          Verify before you run it (either command prints the same value as the table):

              certutil -hashfile sleepv-x64.exe SHA256
              powershell -Command "(Get-FileHash sleepv-x64.exe).Hash -replace '(.{2})','\$1 ')"

          The binaries also live in \`win/dist/\` in the tree, built by the same pipeline; \`SHA256SUMS.txt\` is attached here as a file.

          What this build is checked against, in CI:
          only kernel32, msvcrt, user32, shell32 and advapi32 imported - no api-ms-win-*, no UCRT, no libgcc or winpthread DLLs;
          PE subsystem version 6.00, so the loader accepts it on Vista;
          no SSE2 instruction in the x86 build, which is what Pentium III and earlier need;
          size budget under 200 KB, and the parser, exit-code and installer behaviour exercised under Wine.

          Usage in one line:

              sleepv 5m && echo done          countdown, then continue
              sleepv 1h 30m --run "ipconfig /all"      run something after the pause
              sleepv --install                every user on this PC gets "sleepv" (UAC)
              sleepv 30s --strict-cancel      Ctrl+C returns 130 and stops the batch

          Notes on behaviour, including how it differs from the Linux bash script: README-EN.md (English) and README.md (Russian).
          EOF
          if [ -n "${PRE_RELEASE:-}" ] || echo "$GITHUB_REF_NAME" | grep -q -- "-"; then
            flag="--prerelease"
          else
            flag=""
          fi
          gh release create "$GITHUB_REF_NAME" bin/* --title "sleepv $GITHUB_REF_NAME" $flag --notes-file notes.md
          echo "published $(gh release view "$GITHUB_REF_NAME" --json tagName,assets -q '.tagName + " " + (.assets | length | tostring) + " assets"')"

